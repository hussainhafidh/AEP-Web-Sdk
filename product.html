<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Detail</title>

  <!-- Initialize adobeDataLayer early -->
  <script>
    window.adobeDataLayer = window.adobeDataLayer || [];
  </script>

  <style>
    body { font-family: Arial; padding: 20px; }
    .product-detail { display: flex; flex-direction: column; align-items: center; }
    img { max-width: 200px; }
    #exitIntentBuyNow {
  padding: 12px 24px;
  margin-top: 10px;
  background: #2e7d32;
  color: #ffffff;
  border: none;
  border-radius: 4px;
  font-size: 16px;
  cursor: pointer;
}
  </style>
</head>
<body>
  <h1>Product Detail</h1>
  <div class="product-detail" id="productDetail"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    /**
 * UC7: Classify each Fake Store product for gender-based
 * Adobe Target Recommendations.
 */
function getUc7ProductGender(category) {
  const normalizedCategory =
    String(category || "").toLowerCase();

  if (normalizedCategory === "men's clothing") {
    return "male";
  }

  if (normalizedCategory === "women's clothing") {
    return "female";
  }

  // Jewellery and electronics are used as generic/unisex products.
  return "unisex";
}
    //uc7 ends here---
    
    fetch(`https://fakestoreapi.com/products/${productId}`)
      .then(res => res.json())
      .then(product => {
        document.title = product.title;

        const container = document.getElementById("productDetail");
        container.innerHTML = `
          <img src="${product.image}" alt="${product.title}" />
          <h2>${product.title}</h2>
          <p>${product.description}</p>
<p><strong>Price:</strong> $${product.price}</p>

<button
  type="button"
  id="exitIntentBuyNow"
  data-product-id="${product.id}"
>
  Buy Now
</button>        `;

        const buyNowButton = document.getElementById(
  "exitIntentBuyNow"
);

buyNowButton.addEventListener("click", function () {
  const selectedProductId =
    this.getAttribute("data-product-id");

  window.location.href =
    `thank-you.html?productId=${encodeURIComponent(
      selectedProductId
    )}`;
});

        // Push product data to adobeDataLayer
  adobeDataLayer.push({
  event: "prodView",

  page: {
    pageName: "Product Detail Page",
    language: "en",
    pageType: "ProductPage"
  },

  customer: {
    subscriptionEndDate: "2026-09-30"
  },

  product: {
    productID: product.id.toString(),
    productName: product.title,
    productURL: window.location.href,
    productImageURL: product.image,
    productCaption: product.description,

    // UC7 only: These fields are isolated from other activities.
  uc7ProductCategory: product.category,
  uc7ProductGender: getUc7ProductGender(product.category)
  }
});

        // Lunch SDK after data pushed
        const launchScript = document.createElement("script");
        launchScript.src = "https://assets.adobedtm.com/e78d80a30a77/58d19e840cbd/launch-17fc24eb3e1e-development.min.js";
        launchScript.async = true;
        document.body.appendChild(launchScript);
      });
  </script>
</body>
</html>
